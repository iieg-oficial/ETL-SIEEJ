name: Docker Build & DAGs

on:
  workflow_call:

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env file
        run: echo "AIRFLOW_UID=50000" > .env

      - name: Build Airflow image
        run: docker compose build

      - name: Start Postgres and Redis
        run: docker compose up -d postgres redis

      - name: Initialize Airflow
        run: docker compose up airflow-init

      - name: Verify DAGs
        run: |
          git fetch origin develop --depth=1
          DEVELOP_DAGS=$(git show origin/develop:dags/ | grep '\.py$' | grep -v '__init__')
          MISSING=()
          for dag in $DEVELOP_DAGS; do
            [ ! -f "dags/$dag" ] && MISSING+=("$dag")
          done
          if [ ${#MISSING[@]} -ne 0 ]; then
            echo "::error::DAGs eliminados respecto a develop: ${MISSING[*]}"
            exit 1
          fi
          echo "OK: todos los DAGs de develop presentes"

      - name: Cleanup
        if: always()
        run: docker compose down -v
