name: Docker Build & DAGs

on:
  workflow_call:

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env file
        run: echo "AIRFLOW_UID=50000" > .env

      - name: Build Airflow image
        run: docker compose build

      - name: Start Postgres and Redis
        run: docker compose up -d postgres redis

      - name: Initialize Airflow
        run: docker compose up airflow-init

      - name: Verify DAGs have no import errors
        run: |
          cat > /tmp/check_dags.py << 'EOF'
          import sys
          from airflow.models import DagBag
          bag = DagBag('/opt/airflow/dags', include_examples=False)
          if bag.import_errors:
              for f, err in bag.import_errors.items():
                  print('ERROR', f, err)
              sys.exit(1)
          print('OK:', list(bag.dags.keys()))
          EOF
          docker compose run --rm -T \
            -v /tmp/check_dags.py:/tmp/check_dags.py \
            airflow-cli python /tmp/check_dags.py

      - name: Cleanup
        if: always()
        run: docker compose down -v
