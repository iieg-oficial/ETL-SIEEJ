name: Pre-commit

on:
  workflow_call:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: pre-commit/action@v3.0.1
        env:
          # dag-tests necesita airflow y las deps del proyecto; corre en docker-build
          SKIP: dag-tests

      - name: Ruff check
        run: |
          pip install ruff==0.9.0
          ruff check --output-format=github .
          ruff format --check .
