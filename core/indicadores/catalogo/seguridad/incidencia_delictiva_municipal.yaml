id: incidencia_delictiva_municipal
nombre: Incidencia delictiva del fuero común, municipal
tema: seguridad
definicion: >
  Conteo mensual de carpetas de investigación abiertas por presuntos delitos del
  fuero común, por municipio y tipo de delito.
unidad: carpetas de investigación
fuente: SESNSP — Incidencia delictiva del fuero común
pipeline: delitos_fuero_comun
origen: vw_delitos_serie_historica
nivel: municipal
periodicidad: mensual
cobertura:
  geografica: Nacional
  temporal: "2015-actual"
notas: |
  El tipo de delito viaja en la columna categoria del formato largo. Sin el
  parámetro tipo_delito la consulta devuelve todos los tipos, y el límite de
  5000 filas del banco se alcanza casi de inmediato: conviene filtrar por
  municipio o por tipo.
  Los meses sin registros no aparecen: la vista base descarta los ceros y nulos.
parametros:
  - nombre: cve_geo
    tipo: str
    requerido: false
    descripcion: Clave INEGI de 5 dígitos del municipio (ej. 14039). Omitir para todos.
  - nombre: tipo_delito
    tipo: str
    requerido: false
    descripcion: >
      Tipo de delito exacto según el catálogo del SESNSP (ej. "Robo",
      "Lesiones", "Feminicidio"). Omitir para todos los tipos.
  - nombre: anio_min
    tipo: int
    requerido: false
    descripcion: Año inicial de la serie. Omitir para la serie completa.
sql: |
  SELECT
      cve_municipio::text AS cve_geo,
      municipio::text     AS nombre_geo,
      anio::text || '-' || LPAD(array_position(
          ARRAY['Enero','Febrero','Marzo','Abril','Mayo','Junio',
                'Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'],
          mes)::text, 2, '0')  AS periodo,
      SUM(conteo)::numeric AS valor,
      tipo_delito::text    AS categoria
  FROM vw_delitos_serie_historica
  WHERE (CAST(:cve_geo AS text) IS NULL
         OR cve_municipio = CAST(:cve_geo AS text))
    AND (CAST(:tipo_delito AS text) IS NULL
         OR tipo_delito = CAST(:tipo_delito AS text))
    AND (CAST(:anio_min AS integer) IS NULL
         OR anio >= CAST(:anio_min AS integer))
  GROUP BY 1, 2, 3, 5
  ORDER BY 1, 3, 5
