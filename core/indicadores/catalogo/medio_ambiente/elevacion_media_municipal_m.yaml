id: elevacion_media_municipal_m
nombre: Elevación media municipal
tema: medio_ambiente
definicion: Elevación media del modelo de elevación acondicionado dentro del límite municipal seleccionado.
unidad: metros
fuente: IIEG, derivado del CEM 4.0 de INEGI, edición 2025 con cobertura temporal 2024
pipeline: pendientes
origen: vw_pendientes_estadisticas_municipales
nivel: municipal
periodicidad: no periódica
cobertura: {geografica: Jalisco, temporal: "2024"}
parametros:
  - {nombre: cve_geo, tipo: str, requerido: false, descripcion: Clave EEMMM; omitir para todos los municipios.}
  - {nombre: fuente_limite, tipo: str, requerido: true, descripcion: Fuente territorial iieg o inegi.}
sql: |
  SELECT cvegeo::text AS cve_geo, nombre_geo::text, '2024'::text AS periodo,
         elevation_mean_m::numeric AS valor, 'total'::text AS categoria
  FROM vw_pendientes_estadisticas_municipales
  WHERE fuente_limite = CAST(:fuente_limite AS text)
    AND (CAST(:cve_geo AS text) IS NULL OR cvegeo = CAST(:cve_geo AS text))
  ORDER BY cve_geo
