id: tasa_desocupacion_jalisco
nombre: Tasa de desocupación, Jalisco
tema: empleo
definicion: >
  Tasa de desocupación estatal de Jalisco: población desocupada entre población
  económicamente activa por cien (PD / PEA × 100), calculada trimestralmente a
  partir de los microdatos de la ENOE.
unidad: porcentaje
fuente: INEGI — Encuesta Nacional de Ocupación y Empleo (ENOE), microdatos
pipeline: enoe_microdatos
origen: mv_enoe_tasas_jalisco
nivel: estatal
periodicidad: trimestral
cobertura:
  geografica: Jalisco
  temporal: "2005-actual"
notas: |
  Es la vista que reproduce las cifras oficiales del INEGI para Jalisco.
  No comparable con la tasa de desocupación municipal del ILMM: distinto diseño
  muestral y distinta periodicidad.
parametros:
  - nombre: anio_min
    tipo: int
    requerido: false
    descripcion: Año inicial de la serie. Omitir para la serie completa.
sql: |
  SELECT
      '14'::text                             AS cve_geo,
      'Jalisco'::text                        AS nombre_geo,
      anio::text || '-Q' || trimestre::text  AS periodo,
      td::numeric                            AS valor,
      NULL::text                             AS categoria
  FROM mv_enoe_tasas_jalisco
  WHERE (CAST(:anio_min AS integer) IS NULL
         OR anio >= CAST(:anio_min AS integer))
  ORDER BY anio, trimestre
