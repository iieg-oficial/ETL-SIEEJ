[project]
name = "etl-sieej"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [
    ".github/skills",
]

[tool.ruff.lint]
select = [
    "F401", # unused imports
    "F811", # redefined unused variable
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["core", "dags"]
