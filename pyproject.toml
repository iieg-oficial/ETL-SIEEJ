[project]
name = "etl-sieej"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
pythonpath = ["."]
markers = [
    "integration: tests that require a live PostgreSQL database",
]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [
    ".claude",
    ".github",
    ".opencode",
]

[tool.ruff.lint]
select = [
    "F401", # unused imports
    "F811", # redefined unused variable
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["core", "dags"]
